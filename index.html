<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гайды Белой мглы</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #0C131E; --panel: #141F2E; --panel-2: #1B2A3D; --line: #24384F;
    --text: #E7EFF7; --muted: #93A8BD; --ice: #7FBEEA; --amber: #F0A83C;
    --amber-soft: rgba(240,168,60,.14); --ice-soft: rgba(127,190,234,.12);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #F2F7FC; --panel: #FFFFFF; --panel-2: #E9F1F9; --line: #CFDEEC;
      --text: #182430; --muted: #5B7186; --ice: #2E7CB8; --amber: #C77E14;
      --amber-soft: rgba(199,126,20,.12); --ice-soft: rgba(46,124,184,.10);
    }
  }
  :root[data-theme="light"] {
    --bg: #F2F7FC; --panel: #FFFFFF; --panel-2: #E9F1F9; --line: #CFDEEC;
    --text: #182430; --muted: #5B7186; --ice: #2E7CB8; --amber: #C77E14;
    --amber-soft: rgba(199,126,20,.12); --ice-soft: rgba(46,124,184,.10);
  }

  * { box-sizing: border-box; }
  html { scroll-padding-top: 70px; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    font-size: 16px; line-height: 1.55;
  }
  a { color: var(--ice); }

  /* ---------- каркас ---------- */
  .layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: 100vh; }
  nav {
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    border-right: 1px solid var(--line); background: var(--panel); padding: 22px 14px 40px;
  }
  .brand {
    display: block; text-decoration: none; color: var(--text);
    font-family: "Unbounded", sans-serif; font-weight: 800; font-size: 17px; line-height: 1.2;
    padding: 0 10px 18px;
  }
  .brand small {
    display: block; margin-top: 6px; font-family: "JetBrains Mono", monospace; font-weight: 400;
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ice);
  }
  .group {
    font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted); padding: 16px 10px 6px;
  }
  nav a.item {
    display: block; padding: 7px 10px; border-radius: 5px; color: var(--text);
    text-decoration: none; font-size: 14.5px; line-height: 1.3;
  }
  nav a.item:hover { background: var(--panel-2); }
  nav a.item[aria-current="page"] { background: var(--amber); color: #0C131E; font-weight: 600; }
  nav a.item .num { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--muted); margin-right: 6px; }
  nav a.item[aria-current="page"] .num { color: #0C131E; }

  .topbar { display: none; }
  main { min-width: 0; }
  .content { max-width: 880px; margin: 0 auto; padding: 0 28px 80px; }

  @media (max-width: 860px) {
    .layout { display: block; }
    nav {
      position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 20;
      transform: translateX(-100%); transition: transform .2s ease;
    }
    body.nav-open nav { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.45); }
    .topbar {
      display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10;
      background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 16px;
    }
    .topbar button {
      font: 600 14px "IBM Plex Sans", sans-serif; color: var(--text); background: var(--panel);
      border: 1px solid var(--line); border-radius: 5px; padding: 7px 12px; cursor: pointer;
    }
    .topbar span { font-family: "Unbounded", sans-serif; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .content { padding: 0 16px 64px; }
  }

  /* ---------- главная ---------- */
  header.home { padding: 48px 0 8px; }
  .eyebrow {
    font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ice); margin-bottom: 14px;
  }
  h1.title {
    font-family: "Unbounded", sans-serif; font-weight: 800; font-size: clamp(28px, 5vw, 44px);
    line-height: 1.12; margin: 0 0 14px; text-wrap: balance;
  }
  .lede { color: var(--muted); max-width: 60ch; margin: 0; }
  .home h2 { font-family: "Unbounded", sans-serif; font-weight: 600; font-size: 19px; margin: 40px 0 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .card {
    display: block; text-decoration: none; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px;
  }
  .card:hover { border-color: var(--amber); }
  .card b { display: block; font-weight: 600; margin-bottom: 4px; }
  .card span { color: var(--muted); font-size: 14px; }
  .card .num { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--amber); display: block; margin-bottom: 4px; }

  /* ---------- HTML-гайд во фрейме ---------- */
  .framebar {
    display: flex; justify-content: flex-end; padding: 14px 0 0;
    font-family: "JetBrains Mono", monospace; font-size: 12.5px;
  }
  iframe.guide { display: block; width: 100%; border: 0; min-height: 80vh; background: var(--bg); }
  .content.wide { max-width: none; padding: 0; }
  .content.wide .framebar { padding: 14px 28px 0; }

  /* ---------- Markdown ---------- */
  .md { padding-top: 36px; }
  .md h1 { font-family: "Unbounded", sans-serif; font-weight: 800; font-size: clamp(26px, 4.5vw, 38px); line-height: 1.15; margin: 0 0 18px; text-wrap: balance; }
  .md h2 { font-family: "Unbounded", sans-serif; font-weight: 600; font-size: 21px; margin: 40px 0 10px; text-wrap: balance; }
  .md h3 { font-size: 17px; font-weight: 600; margin: 28px 0 8px; }
  .md h4 { font-size: 15.5px; font-weight: 600; margin: 22px 0 6px; }
  .md p, .md li { max-width: 72ch; }
  .md li { margin: 5px 0; }
  .md strong { font-weight: 600; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
  .md code { font-family: "JetBrains Mono", monospace; font-size: .88em; background: var(--panel-2); padding: 1px 6px; border-radius: 4px; }
  .md pre { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; }
  .md blockquote { margin: 18px 0; padding: 12px 18px; border-left: 3px solid var(--amber); background: var(--amber-soft); border-radius: 0 6px 6px 0; }
  .md blockquote p { margin: 0; }
  .md .tbl { overflow-x: auto; margin: 16px 0; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  .md table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
  .md th, .md td { text-align: left; padding: 9px 14px; border-top: 1px solid var(--line); vertical-align: top; }
  .md thead th { border-top: 0; font-family: "JetBrains Mono", monospace; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .md input[type="checkbox"] { margin-right: 6px; }
  .pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 48px; border-top: 1px solid var(--line); padding-top: 18px; }
  .pager a { text-decoration: none; font-size: 14.5px; }
  .pager a small { display: block; font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .pager a.next { text-align: right; margin-left: auto; }
  .err { color: var(--muted); padding-top: 40px; }
</style>
</head>
<body>
<div class="layout">
  <nav id="nav" aria-label="Гайды"></nav>
  <main>
    <div class="topbar"><button type="button" id="menu">☰ Гайды</button><span id="crumb">Гайды Белой мглы</span></div>
    <div class="content" id="view"></div>
  </main>
</div>

<script>
// Порядок и названия. html — отдельные гайды (открываются во фрейме), md — текстовые гайды из папки md/.
const GROUPS = [
  { title: 'Ивенты', items: [
    { id: 'bear-hunt.html', name: 'Охота на медведя', note: 'полный гайд: механика, составы, проверка 5/40/55' },
    { id: 'bear.html', name: 'Мишка: памятка альянса', note: 'коротко для всех: слот 1, войска, расписание' },
    { id: 'foundry.html', name: 'Битва за литейную', note: 'здания, очки, план часа, роли' },
    { id: 'fortress.html', name: 'Захват форта', note: 'двойной рейд, оборона, план пятницы' },
    { id: 'frostfire.html', name: 'Рудник ледяного огня', note: 'карта, навыки, план матча' },
    { id: 'winter-siege.html', name: 'Зимняя осада', note: 'расстановка и бой в субботу' },
    { id: 'experts.html', name: 'Рассветная академия', note: 'эксперты и порядок прокачки' },
  ]},
  { title: 'Справочник', items: [
    { id: 'ивенты.md', name: 'Ивенты: как участвовать', note: 'выжимки по всем событиям' },
    { id: 'магазины.md', name: 'Магазины', note: 'что покупать' },
    { id: 'рудник-ледяного-огня.md', name: 'Рудник ледяного огня (текст)' },
    { id: 'зимняя-осада.md', name: 'Зимняя осада (текст)' },
    { id: 'рассветная-академия.md', name: 'Рассветная академия (текст)' },
  ]},
];
const ALL = GROUPS.flatMap(g => g.items);
const byId = Object.fromEntries(ALL.map(i => [i.id, i]));

const nav = document.getElementById('nav');
const view = document.getElementById('view');
const crumb = document.getElementById('crumb');

function label(i) { return (i.num ? `<span class="num">${i.num}</span>` : '') + i.name; }

nav.innerHTML = `<a class="brand" href="#">Гайды Белой мглы<small>государство 75</small></a>` +
  GROUPS.map(g => `<div class="group">${g.title}</div>` +
    g.items.map(i => `<a class="item" href="#${encodeURIComponent(i.id)}" data-id="${i.id}">${label(i)}</a>`).join('')
  ).join('');

document.getElementById('menu').onclick = () => document.body.classList.toggle('nav-open');
nav.addEventListener('click', e => { if (e.target.closest('a')) document.body.classList.remove('nav-open'); });

function home() {
  view.className = 'content';
  view.innerHTML = `<header class="home">
      <div class="eyebrow">Белая мгла: выживание · государство 75</div>
      <h1 class="title">Все гайды в одном месте</h1>
      <p class="lede">Ивенты альянса и справочник по событиям и магазинам. Меню слева — на телефоне кнопка «Гайды» вверху.</p>
    </header>` +
    GROUPS.map(g => `<div class="home"><h2>${g.title}</h2><div class="cards">` +
      g.items.map(i => `<a class="card" href="#${encodeURIComponent(i.id)}">${i.num ? `<span class="num">${i.num}</span>` : ''}<b>${i.name}</b>${i.note ? `<span>${i.note}</span>` : ''}</a>`).join('') +
      `</div></div>`).join('');
}

// Слаг заголовка как на GitHub — чтобы работали ссылки вида файл.md#раздел
function slug(t) {
  return t.toLowerCase().trim().replace(/<[^>]+>/g, '').replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-');
}

const renderer = new marked.Renderer();
renderer.heading = (text, level, raw) => `<h${level} id="${slug(raw)}">${text}</h${level}>`;
renderer.table = (header, body) => `<div class="tbl"><table><thead>${header}</thead><tbody>${body}</tbody></table></div>`;
renderer.link = (href, title, text) => {
  const m = href && href.match(/^([^/:#?]+\.md)(?:#(.*))?$/);
  if (m) {
    const file = decodeURIComponent(m[1]);
    if (byId[file]) return `<a href="#${encodeURIComponent(file)}${m[2] ? ':' + m[2] : ''}">${text}</a>`;
    return text;
  }
  const ext = /^https?:/.test(href) ? ' target="_blank" rel="noopener"' : '';
  return `<a href="${href}"${ext}>${text}</a>`;
};
marked.use({ renderer, gfm: true });

function pager(id) {
  const idx = ALL.findIndex(i => i.id === id);
  const prev = ALL[idx - 1], next = ALL[idx + 1];
  return `<div class="pager">` +
    (prev ? `<a href="#${encodeURIComponent(prev.id)}"><small>← назад</small>${prev.name}</a>` : '') +
    (next ? `<a class="next" href="#${encodeURIComponent(next.id)}"><small>дальше →</small>${next.name}</a>` : '') +
    `</div>`;
}

async function showMd(item, anchor) {
  view.className = 'content';
  try {
    const res = await fetch('md/' + encodeURIComponent(item.id), { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    view.innerHTML = `<article class="md">${marked.parse(await res.text())}</article>` + pager(item.id);
  } catch (e) {
    view.innerHTML = `<p class="err">Не удалось загрузить ${item.id} (${e.message}).</p>`;
    return;
  }
  const target = anchor && document.getElementById(decodeURIComponent(anchor));
  if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
}

function showHtml(item) {
  view.className = 'content wide';
  view.innerHTML = `<div class="framebar"><a href="${item.id}" target="_blank" rel="noopener">открыть отдельно ↗</a></div>
    <iframe class="guide" src="${item.id}" title="${item.name}"></iframe>` +
    `<div class="content" style="padding-bottom:40px">${pager(item.id)}</div>`;
  const frame = view.querySelector('iframe');
  frame.addEventListener('load', () => {
    const doc = frame.contentDocument;
    doc.querySelectorAll('a.back').forEach(a => a.remove());
    // Ссылки из гайда на другие гайды — открывать внутри индекса
    doc.querySelectorAll('a[href]').forEach(a => {
      const h = a.getAttribute('href');
      if (byId[h]) { a.addEventListener('click', ev => { ev.preventDefault(); location.hash = encodeURIComponent(h); }); }
    });
    const fit = () => { frame.style.height = doc.body.offsetHeight + 'px'; };
    fit();
    new ResizeObserver(fit).observe(doc.body);
  });
  window.scrollTo(0, 0);
}

function route() {
  const raw = decodeURIComponent(location.hash.slice(1));
  const [id, anchor] = raw.split(':');
  const item = byId[id];
  nav.querySelectorAll('a.item').forEach(a => {
    if (a.dataset.id === id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  crumb.textContent = item ? item.name : 'Гайды Белой мглы';
  document.title = item ? item.name + ' · Гайды Белой мглы' : 'Гайды Белой мглы';
  if (!item) { home(); window.scrollTo(0, 0); return; }
  if (id.endsWith('.md')) showMd(item, anchor); else showHtml(item);
}

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
